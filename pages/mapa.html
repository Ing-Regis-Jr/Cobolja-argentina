<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa interactivo · Argentina</title>
    <link rel="icon" href="../assets/icons/sol.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/activities.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body data-base="../">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header" id="site-header"></header>
    <main class="wrap" id="contenido">
      <div class="page-hero" data-img="mapa.jpg" data-hint="Poné assets/img/mapa.jpg · paisaje o mapa de Argentina">
        <p class="section-kicker">Actividad 1</p>
        <h1>Mapa real de Argentina</h1>
        <p>
          Elegí un recorrido y seguí la ruta por Argentina. Cada parada tiene foto,
          un dato curioso y una ficha para contar en la feria.
        </p>
      </div>
      <section class="map-layout">
        <div class="map-shell">
          <div class="filter-row" id="route-row" role="group" aria-label="Elegir recorrido"></div>
          <p class="route-actions">
            <button type="button" class="btn btn-primary" id="tour-btn">Recorrido guiado</button>
          </p>
          <div id="map" role="application" aria-label="Mapa de Argentina con marcadores"></div>
        </div>
        <aside class="place-panel" id="place-panel" aria-live="polite"></aside>
      </section>
      <ul class="place-rail" id="place-rail"></ul>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="../js/config.js"></script>
    <script src="../js/nav.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="../data/lugares.js"></script>
    <script src="../data/lugares-extra.js"></script>
    <script src="../data/recorridos.js"></script>
    <script src="../js/map.js"></script>
  </body>
</html>
